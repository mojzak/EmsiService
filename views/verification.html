<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service des documents référentiels - Ecole Marocaine des Sciences de l'ingénieur</title>
    <link rel="icon" type="image/svg+xml" href="/public/images/favicon.svg">
    <link rel="alternate icon" href="/public/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 14px 40px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo EMSI */
        .logo-wrapper {
            margin-top: 10px;
            margin-bottom: 22px;
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .logo-img {
            max-width: 270px;
            height: auto;
            object-fit: contain;
        }

        .univ-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.55rem;
            font-weight: 700;
            text-align: center;
            color: #1a202c;
            line-height: 1.35;
            margin-bottom: 18px;
            padding: 0 10px;
        }

        .service-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.35rem;
            font-weight: 700;
            text-align: center;
            color: #2d3748;
            line-height: 1.35;
            margin-bottom: 28px;
            padding: 0 10px;
        }

        .form-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .instructions {
            font-size: 0.95rem;
            color: #5a6a7e;
            font-style: italic;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 16px;
        }

        .field-label {
            font-size: 1rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 8px;
            display: block;
        }

        .field-label .required {
            color: #dc2626;
            margin-left: 2px;
        }

        .input-text {
            width: 100%;
            padding: 12px 14px;
            font-size: 1.05rem;
            color: #1f2937;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-text:focus {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .helper-text {
            font-size: 0.85rem;
            color: #6b7280;
            text-align: center;
            margin: 10px 0 18px;
        }

        /* Widget Cloudflare Captcha */
        .captcha-box-outer {
            width: 100%;
            margin-bottom: 14px;
        }

        .captcha-label {
            font-size: 1rem;
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 8px;
            display: block;
        }

        .turnstile-widget {
            background-color: #222222;
            color: #ffffff;
            border-radius: 4px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 68px;
            user-select: none;
            border: 1px solid #333333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
        }

        .turnstile-left {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
        }

        .turnstile-checkbox {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: 2px solid #555555;
            background: #2b2b2b;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .turnstile-checkbox.checking {
            border-color: #f97316;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .turnstile-checkbox.success {
            background-color: #22c55e;
            border-color: #22c55e;
            border-radius: 50%;
        }

        .turnstile-checkbox.success svg {
            display: block;
        }

        .turnstile-checkbox svg {
            display: none;
            fill: none;
            stroke: #ffffff;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .turnstile-status-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #ffffff;
        }

        .turnstile-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 0.65rem;
            color: #9ca3af;
        }

        .turnstile-brand {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
        }

        .turnstile-logo-icon {
            width: 32px;
            height: auto;
        }

        .turnstile-brand-name {
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #f3f4f6;
            font-size: 0.72rem;
        }

        .turnstile-links a {
            color: #9ca3af;
            text-decoration: underline;
            margin: 0 2px;
            font-size: 0.65rem;
        }

        .captcha-error {
            color: #b91c1c;
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
        }

        .error-banner {
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 14px;
            text-align: center;
            display: none;
        }

        .btn-submit {
            width: 100%;
            background-color: #16a34a;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            padding: 13px;
            cursor: pointer;
            margin-top: 14px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #15803d;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- En-tête avec Logo EMSI Officiel -->
    <div class="logo-wrapper">
        <img src="/public/images/emsi_logo.png" alt="Logo EMSI" class="logo-img">
    </div>

    <h1 class="univ-title">Ecole Marocaine des Sciences de l'ingénieur</h1>
    <h2 class="service-title">Service des documents référentiels</h2>

    <div class="form-card">
        <p class="instructions">Veuillez saisir le code au bas du document.</p>

        <div id="errorBanner" class="error-banner"></div>

        <form id="verifyForm" style="width: 100%;" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="code" class="field-label">Code<span class="required">*</span></label>
                <input 
                    type="text" 
                    id="code" 
                    name="code"
                    class="input-text" 
                    placeholder="" 
                    value=""
                    required
                    autocomplete="off"
                >
            </div>

            <p class="helper-text">Tous les champs sont obligatoires</p>

            <!-- Captcha Cloudflare Turnstile -->
            <div class="captcha-box-outer">
                <label class="captcha-label">Captcha*</label>
                
                <div class="turnstile-widget" id="captchaWidget">
                    <div class="turnstile-left" onclick="solveCaptcha()">
                        <div class="turnstile-checkbox" id="captchaCheckbox">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <div class="turnstile-status-text" id="captchaStatus">Je ne suis pas un robot</div>
                    </div>

                    <div class="turnstile-right">
                        <div class="turnstile-brand">
                            <svg class="turnstile-logo-icon" viewBox="0 0 48 24" fill="none">
                                <path d="M38.5 17.5H11.2C8.3 17.5 6 15.2 6 12.3C6 9.6 8.1 7.4 10.7 7.1C11.7 4.1 14.6 2 18 2C22.1 2 25.5 5.1 25.9 9.1C26.9 8.1 28.3 7.5 29.8 7.5C32.8 7.5 35.2 9.7 35.6 12.6C37.3 12.9 38.5 14.4 38.5 16.2C38.5 16.9 38.5 17.5 38.5 17.5Z" fill="#F48120"/>
                                <path d="M31.2 17.5H41.5C43.4 17.5 45 15.9 45 14C45 12.2 43.6 10.7 41.8 10.5C41.5 8 39.4 6 36.9 6C35.8 6 34.8 6.4 34 7.1C34.7 8.3 35.1 9.8 35.1 11.3C35.1 11.8 35 12.3 34.9 12.8C35.8 13.5 36.4 14.6 36.4 15.8C36.4 16.4 36.2 17 36 17.5H31.2Z" fill="#FAAD3F"/>
                            </svg>
                            <span class="turnstile-brand-name">CLOUDFLARE</span>
                        </div>
                        <div class="turnstile-links">
                            <a href="https://www.cloudflare.com/privacypolicy/" target="_blank">Confidentialité</a> • 
                            <a href="https://www.cloudflare.com/website-terms/" target="_blank">Aide</a>
                        </div>
                    </div>
                </div>

                <div id="captchaError" class="captcha-error">Captcha est obligatoire</div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Afficher</button>
        </form>
    </div>
</div>

<script>
    let isCaptchaSolved = false;

    function solveCaptcha() {
        if (isCaptchaSolved) return;
        const checkbox = document.getElementById('captchaCheckbox');
        const status = document.getElementById('captchaStatus');
        const captchaError = document.getElementById('captchaError');

        captchaError.style.display = 'none';
        checkbox.classList.add('checking');
        status.textContent = 'Vérification en cours...';

        setTimeout(() => {
            checkbox.classList.remove('checking');
            checkbox.classList.add('success');
            status.textContent = 'Succès !';
            isCaptchaSolved = true;
        }, 500);
    }

    async function submitForm(e) {
        e.preventDefault();

        const code = document.getElementById('code').value.trim();
        const captchaError = document.getElementById('captchaError');
        const errorBanner = document.getElementById('errorBanner');
        const btnSubmit = document.getElementById('btnSubmit');

        if (!isCaptchaSolved) {
            captchaError.style.display = 'block';
            return;
        }

        captchaError.style.display = 'none';
        errorBanner.style.display = 'none';
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Vérification en cours...';

        try {
            const res = await fetch('/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code, captchaVerified: isCaptchaSolved })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                window.location.href = data.redirectUrl;
            } else {
                errorBanner.textContent = data.message || "Erreur de validation.";
                errorBanner.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Afficher';
            }
        } catch (err) {
            errorBanner.textContent = "Erreur de communication avec le serveur Node.js.";
            errorBanner.style.display = 'block';
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Afficher';
        }
    }
</script>

</body>
</html>
